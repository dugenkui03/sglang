<aside id="tip" role="dialog" aria-label="方法说明" hidden>
<button id="close" type="button" aria-label="关闭方法说明">关闭</button>
<h2>配置准备：两个方法分别做什么？</h2>
<p><code>resolve_once()</code><br>执行一次服务配置解析；已经完成解析时直接返回，避免重复调整参数。</p>
<p><code>_set_envs_and_config()</code><br>设置环境变量、资源限制、信号处理和多进程启动方式，并检查相关依赖版本。</p>
<div id="mode" role="status"></div>
</aside>
<script>
'use strict';
const tip = document.getElementById('tip');
const mode = document.getElementById('mode');
let pinned = false;

// 为方法文字补充透明点击区域，避免文字间的空隙影响鼠标操作。
function createMethodTarget() {
  const text = [...document.querySelectorAll('#graph .messageText')].find(node => node.textContent.includes('resolve_once()'));
  const bounds = text.getBBox(), namespace = 'http://www.w3.org/2000/svg';
  const group = document.createElementNS(namespace, 'g');
  const hit = document.createElementNS(namespace, 'rect');
  for (const [name, value] of Object.entries({x:bounds.x-8,y:bounds.y-6,width:bounds.width+16,height:bounds.height+12,fill:'transparent','pointer-events':'all'})) hit.setAttribute(name, value);
  for (const name of ['role','tabindex','aria-label','aria-controls','aria-expanded']) text.removeAttribute(name);
  text.parentNode.insertBefore(group, text);
  group.append(hit, text);
  for (const [name, value] of Object.entries({class:'method-link',role:'button',tabindex:'0','aria-label':'resolve_once() / _set_envs_and_config() 方法说明','aria-controls':'tip','aria-expanded':'false'})) group.setAttribute(name, value);
  return group;
}
const target = createMethodTarget();

// 在方法附近显示说明；点击后固定，允许移开鼠标继续阅读。
function showNotes(pin) {
  pinned = pin;
  tip.hidden = false;
  const bounds = target.getBoundingClientRect();
  tip.style.left = Math.max(12, Math.min(bounds.left, window.innerWidth-tip.offsetWidth-12))+'px';
  tip.style.top = Math.max(12, Math.min(bounds.bottom+12, window.innerHeight-tip.offsetHeight-12))+'px';
  target.setAttribute('aria-expanded', 'true');
  mode.textContent = pinned ? '已固定：可以移开鼠标阅读' : '悬浮说明：点击方法名可固定';
}

// 收起说明卡片，并同步辅助技术读取的展开状态。
function hideNotes() {
  pinned = false;
  tip.hidden = true;
  target.setAttribute('aria-expanded', 'false');
}
target.addEventListener('pointerenter', () => { if (!pinned) showNotes(false); });
target.addEventListener('pointerleave', () => { if (!pinned) hideNotes(); });
target.addEventListener('focus', () => { if (!pinned) showNotes(false); });
target.addEventListener('blur', () => { if (!pinned) hideNotes(); });
target.addEventListener('click', () => showNotes(true));
target.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); showNotes(true); } });
document.getElementById('close').addEventListener('click', hideNotes);
document.addEventListener('keydown', event => { if (event.key === 'Escape') hideNotes(); });
</script>
